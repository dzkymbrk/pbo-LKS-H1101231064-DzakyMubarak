<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpustakaan Digital SPA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-gray-100 min-h-screen">

    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col space-y-2"></div>

    <nav class="bg-blue-600 text-white shadow-md">

            <h1 class="text-xl font-bold tracking-wide">Perpustakaan Digital</h1>
            <div class="space-x-4">

                <a href="#categories" class="px-3 py-2 rounded hover:bg-blue-700 transition">Kategori</a>
            </div>
        </div>
    </nav>

    <main id="app" class="container mx-auto px-6 py-8">
        <!-- Konten SPA dirender di sini -->
    </main>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/pages/api.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/books.js"></script>
    <script src="js/pages/categories.js"></script>
    <script src="js/app.js"></script>

</html>
